[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-discovery-flight-simulator"
version = "0.1.0"
description = "A deterministic sandbox for comparing experiment-selection policies in simulated scientific worlds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lu Zhang" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
discovery-flight-simulator = "discovery_flight_simulator.cli:main"

[project.urls]
Homepage = "https://github.com/rockyzl/scientific-discovery-flight-simulator"
Repository = "https://github.com/rockyzl/scientific-discovery-flight-simulator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
